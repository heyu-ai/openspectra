[workspace]
resolver = "2"
members = ["crates/spectra-core", "crates/spectra-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/howie/openspectra"
description = "Open-source reimplementation of the Spectra spec-driven development CLI"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
once_cell = "1"
