[workspace]
resolver = "2"
members = ["crates/spectra-core", "crates/spectra-cli"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/howie/openspectra"
description = "Open-source reimplementation of the Spectra spec-driven development CLI"
readme = "README.md"
keywords = ["spectra", "spec-drift", "openspec", "cli", "git"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Bump this with workspace.package.version so local crates publish together.
spectra-core = { path = "crates/spectra-core", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
once_cell = "1"
# `write_atomically` needs the process umask to reproduce the reference
# binary's `0666 & ~umask` mode on newly-created files; std exposes no umask
# API. See docs/reverse-engineering/update.md and issue #93.
libc = "0.2"
# dev-only: integration tests hash `update`'s written trees against the
# oracle-captured golden TSV (docs/reverse-engineering/golden/update-trees-*).
sha2 = "0.11"
