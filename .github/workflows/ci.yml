name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Style checks are advisory for now (the dev toolchain that produced this
      # tree lacks rustfmt/clippy components); build + test are the hard gate.
      - name: Format check
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --all
      - name: Smoke-test the CLI on this repo
        run: |
          # The drift binary must at least run and print help on Linux.
          ./target/release/spectra --help
          ./target/release/spectra drift --help
