name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # OpenSpectra claims cross-platform support (Linux musl + macOS); build
        # and test on both so a platform-specific regression can't hide.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Style checks are platform-independent, so run them once (on Linux) as
      # hard gates. CLAUDE.md treats fmt/clippy as hard gates locally; CI now
      # matches. If a clippy finding is a false positive, suppress it narrowly
      # in code rather than reverting this to advisory.
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --all
      - name: Smoke-test the CLI on this repo
        run: |
          # The drift binary must at least run and print help.
          ./target/release/spectra --help
          ./target/release/spectra drift --help
          ./target/release/spectra init --help
