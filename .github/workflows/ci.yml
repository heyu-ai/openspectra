name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --all
      - name: Smoke-test the CLI on this repo
        run: |
          # The drift binary must at least run and print help.
          ./target/release/spectra --help
          ./target/release/spectra drift --help

  publish-dry-run:
    name: crates.io publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run publish (both crates, in dependency order)
        # Catches crates.io metadata regressions (bad category, missing readme,
        # version-pin mismatch) before an actual release. --workspace resolves the
        # in-workspace dependency order and verifies spectra-cli against the
        # locally packaged spectra-core, which is not yet on crates.io.
        run: cargo publish --workspace --dry-run --locked
