name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish spectra-core and spectra-cli to crates.io'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish" ]; then
            echo 'Confirmation must exactly equal "publish".'
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Show workspace version
        run: grep -m1 -E '^[[:space:]]*version[[:space:]]*=' Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Publish core, then cli. Each step is idempotent: if the target version is
      # already on crates.io (e.g. a previous run published core but failed on cli),
      # the publish is skipped so the rerun can proceed to the next crate instead of
      # aborting on a "crate version already uploaded" error.
      - name: Publish spectra-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="spectra-core") | .version')"
          if curl -sfL "https://crates.io/api/v1/crates/spectra-core/${version}" >/dev/null; then
            echo "spectra-core ${version} already on crates.io; skipping."
          else
            cargo publish -p spectra-core --locked --token "$CARGO_REGISTRY_TOKEN"
          fi

      - name: Publish spectra-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="spectra-cli") | .version')"
          if curl -sfL "https://crates.io/api/v1/crates/spectra-cli/${version}" >/dev/null; then
            echo "spectra-cli ${version} already on crates.io; skipping."
          else
            cargo publish -p spectra-cli --locked --token "$CARGO_REGISTRY_TOKEN"
          fi
