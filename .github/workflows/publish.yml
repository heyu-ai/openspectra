name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish spectra-core and spectra-cli to crates.io'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish" ]; then
            echo 'Confirmation must exactly equal "publish".'
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Show workspace version
        run: grep -m1 '^version = ' Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish spectra-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p spectra-core --locked --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish spectra-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p spectra-cli --locked --token "$CARGO_REGISTRY_TOKEN"
