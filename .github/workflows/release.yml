name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            install-musl: true
            static-check: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            install-musl: true
            static-check: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            install-musl: false
            static-check: false
          - target: aarch64-apple-darwin
            os: macos-latest
            install-musl: false
            static-check: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.install-musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}" -p spectra-cli

      - name: Verify static musl binary
        if: matrix.static-check
        run: |
          binary="target/${{ matrix.target }}/release/spectra"
          file "$binary"
          if ! ldd "$binary" 2>&1 | tee ldd.txt | grep -q "not a dynamic executable"; then
            echo "Expected a fully static musl binary"
            cat ldd.txt
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          archive="spectra-${tag}-${target}.tar.gz"
          mkdir -p "dist/spectra-${tag}-${target}"
          cp "target/${target}/release/spectra" "dist/spectra-${tag}-${target}/"
          cp LICENSE README.md "dist/spectra-${tag}-${target}/"
          tar -C dist -czf "dist/${archive}" "spectra-${tag}-${target}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
          else
            (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spectra-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  docker:
    name: Publish Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64-only by design: aarch64 Linux users should use the aarch64-unknown-linux-musl release tarball.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/howie/openspectra:${{ github.ref_name }}
            ghcr.io/howie/openspectra:latest
