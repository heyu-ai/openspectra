name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            install-musl: true
            static-check: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            install-musl: true
            static-check: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            install-musl: false
            static-check: false
          - target: aarch64-apple-darwin
            os: macos-latest
            install-musl: false
            static-check: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install musl tools
        if: matrix.install-musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}" -p spectra-cli

      - name: Verify static musl binary
        if: matrix.static-check
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/spectra"
          # `file` exits 0 on success, so its exit code is authoritative and does
          # not depend on pipefail (unlike glibc `ldd`, which exits 1 on a static
          # binary and would false-fail the pipeline under `bash -eo pipefail`).
          info="$(file "$binary")"
          echo "$info"
          # Rust musl targets differ by arch: aarch64 links non-PIE ("statically
          # linked"), x86_64 links static-PIE ("static-pie linked"). Both are fully
          # static (no dynamic deps); accept either. (Note: `ldd` on the static-PIE
          # x86_64 binary misleadingly prints a musl loader line, which is exactly
          # why `file` is the authoritative check here.)
          case "$info" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *) echo "Expected a fully static musl binary"; exit 1 ;;
          esac

      - name: Smoke-test the binary
        # Every build leg runs on a runner matching its target arch, so the
        # freshly built binary executes natively here.
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/spectra"
          "$binary" --help
          "$binary" drift --help

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          archive="spectra-${tag}-${target}.tar.gz"
          mkdir -p "dist/spectra-${tag}-${target}"
          cp "target/${target}/release/spectra" "dist/spectra-${tag}-${target}/"
          cp LICENSE README.md "dist/spectra-${tag}-${target}/"
          tar -C dist -czf "dist/${archive}" "spectra-${tag}-${target}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
          else
            (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spectra-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.sha256

      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          # Mark pre-release tags (e.g. v0.1.0-rc1) as GitHub pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  docker:
    name: Publish Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64-only by design: aarch64 Linux users should use the aarch64-unknown-linux-musl release tarball.
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/howie/openspectra:${{ github.ref_name }}

      - name: Smoke-test the image
        env:
          IMAGE: ghcr.io/howie/openspectra:${{ github.ref_name }}
        run: |
          set -euo pipefail
          # ENTRYPOINT is `spectra`, so args are passed straight through.
          docker run --rm "$IMAGE" --help
          docker run --rm "$IMAGE" drift --help

      - name: Push image
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/howie/openspectra"
          docker push "${image}:${REF_NAME}"
          # Only advance :latest for stable tags (skip pre-releases like v0.1.0-rc1).
          case "$REF_NAME" in
            *-*) echo "Pre-release ${REF_NAME}; not updating :latest." ;;
            *)
              docker tag "${image}:${REF_NAME}" "${image}:latest"
              docker push "${image}:latest"
              ;;
          esac
