# 已回報並修正的 bug 的「值層級」mutation case，給 scripts/mutate-check.py 用。
# 每個 case 把修正還原成當初的錯誤形狀，並指定應該因此失敗的回歸測試。
# 對照表見 docs/testing/regression-catalog.md。

[[case]]
id = "118-common-dir"
issue = "#118"
file = "crates/spectra-core/src/git.rs"
find = '&["rev-parse", "--git-common-dir"]'
replace = '&["rev-parse", "--git-dir"]'
package = "spectra-core"
test = "parking_from_a_linked_worktree_lands_in_the_shared_store"

[[case]]
id = "80-first-block-only"
issue = "#80 / OpenSpec 1.12"
file = "crates/spectra-core/src/markdown.rs"
find = '''            } else {
                text_lines.join("\n")
            },'''
replace = '''            } else {
                text_lines[0].to_string()
            },'''
package = "spectra-core"
test = "a_goal_first_requirement_passes"

[[case]]
id = "80-scenario-text-counts"
issue = "#80 / OpenSpec 1.12"
file = "crates/spectra-core/src/markdown.rs"
find = "if scenarios.is_empty() && !trimmed.is_empty() {"
replace = "if !trimmed.is_empty() {"
package = "spectra-core"
test = "a_shall_that_appears_only_inside_a_scenario_is_not_normative"

[[case]]
id = "155-tty-capital-y-rejected"
issue = "#155-2"
file = "crates/spectra-cli/src/main.rs"
find = "        if !matches!(response.chars().next(), Some('y' | 'Y')) {"
replace = "        if !matches!(response.chars().next(), Some('y')) {"
package = "spectra-cli"
target = ["--test", "cli_integration"]
test = "archive_accepts_y_and_capital_y_on_a_terminal"

[[case]]
id = "155-tty-n-accepted"
issue = "#155-2"
file = "crates/spectra-cli/src/main.rs"
find = "        if !matches!(response.chars().next(), Some('y' | 'Y')) {"
replace = "        if !matches!(response.chars().next(), Some('y' | 'Y' | 'n')) {"
package = "spectra-cli"
target = ["--test", "cli_integration"]
test = "archive_prompts_and_aborts_on_a_terminal"
